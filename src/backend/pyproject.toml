[tool.poetry]
name = "finance-report-backend"
version = "0.1.0"
description = "Finance Report — Backend API (FastAPI) con clasificacion de gastos, ML y asistente IA"
authors = ["Finance Report Team"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "src" },
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
# Web framework
fastapi = "^0.115.0"
uvicorn = { version = "^0.32.0", extras = ["standard"] }
python-multipart = "^0.0.12"

# Data validation
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"

# Database
sqlalchemy = { version = "^2.0.35", extras = ["asyncio"] }
asyncpg = "^0.29.0"
alembic = "^1.14.0"
psycopg2-binary = "^2.9.9"

# Messaging
pika = "^1.3.2"
aio-pika = "^9.4.1"

# Cache
redis = "^5.2.0"

# Auth
python-jose = { version = "^3.3.0", extras = ["cryptography"] }
passlib = { version = "^1.7.4", extras = ["bcrypt"] }

# HTTP client
httpx = "^0.28.0"

# Excel parsing
openpyxl = "^3.1.5"
pandas = "^2.2.0"

# ML / NLP
scikit-learn = "^1.5.0"
sentence-transformers = "^3.2.0"

# LLM
google-generativeai = "^0.8.0"
groq = "^0.11.0"

# Storage (S3-compatible)
boto3 = "^1.35.0"
aioboto3 = "^13.2.0"

# Logging
structlog = "^24.4.0"

# Observability
prometheus-client = "^0.21.0"
opentelemetry-api = "^1.28.0"
opentelemetry-sdk = "^1.28.0"
opentelemetry-instrumentation-fastapi = ">=0.49b0"
opentelemetry-instrumentation-sqlalchemy = ">=0.49b0"
opentelemetry-instrumentation-redis = ">=0.49b0"
opentelemetry-exporter-otlp = "^1.28.0"

# Web Push
pywebpush = "^2.0.0"

# Email
resend = "^2.0.0"

# Scheduling (para notificaciones programadas)
apscheduler = "^3.10.4"

# Misc
python-dotenv = "^1.0.1"
python-slugify = "^8.0.4"


[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-bdd = "^8.0.0"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
fakeredis = "^2.26.0"
aiosqlite = "^0.22.0"
httpx = "^0.28.0"

# Code quality
black = "^24.10.0"
ruff = "^0.7.0"
mypy = "^1.13.0"

# Type stubs
types-redis = "^4.6.0"
types-python-jose = "^3.3.0"

# Pre-commit
pre-commit = "^4.0.0"


[tool.poetry.scripts]
dev = "scripts.dev:main"
test = "scripts.test:main"
lint = "scripts.lint:main"


[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--disable-warnings",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:coverage/html",
    "--cov-report=xml:coverage/coverage.xml",
]
markers = [
    "unit: Unit tests (no infrastructure required)",
    "integration: Integration tests (requires database/redis/rabbitmq)",
    "slow: Slow-running tests",
    "e2e: End-to-end tests",
]


[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | alembic
  | build
  | dist
)/
'''


[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "alembic/versions",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
]
ignore = ["E501", "B008"]  # Line too long — handled by black; B008 — Depends() is idiomatic FastAPI


[tool.ruff.lint.isort]
known-first-party = ["src"]
force-single-line = false


[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "alembic/",
    "tests/",
    ".venv/",
]
plugins = ["pydantic.mypy"]


[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
