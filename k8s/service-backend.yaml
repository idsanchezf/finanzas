# ============================================================
# Finance Report — Service (ClusterIP) — API Backend
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: finance-backend-svc
  namespace: finance-report
  labels:
    app: finance-report
    component: backend
spec:
  type: ClusterIP
  selector:
    app: finance-backend
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
