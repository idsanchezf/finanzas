# ============================================================
# Finance Report — Redis Deployment + Service (para uso local/on-prem)
# ============================================================
# NOTA: En produccion se recomienda usar Upstash Redis (manejado).
# Este manifiesto es para entornos donde se requiera Redis auto-gestionado.
# Si usas Upstash, NO aplicar este archivo.
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: finance-report
  labels:
    app: finance-report
    component: redis
  annotations:
    description: "Redis cache local. En produccion usar Upstash Redis."
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redis
              protocol: TCP
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - "256mb"
            - --maxmemory-policy
            - allkeys-lru
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 300Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 999   # redis user en alpine
            allowPrivilegeEscalation: false
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
---
# ============================================================
# Redis Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: finance-report
  labels:
    app: finance-report
    component: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
---
# ============================================================
# Persistent Volume Claim — Redis
# ============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: finance-report
  labels:
    app: finance-report
    component: redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
