# ============================================================
# Finance Report — Secrets (template con placeholders)
# NUNCA subir este archivo con valores reales a Git.
# Usar: kubectl create secret generic finance-secrets --from-literal=KEY=VALUE
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: finance-secrets
  namespace: finance-report
  labels:
    app: finance-report
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://user:password@host:5432/finance_report"
  DATABASE_URL_SYNC: "postgresql://user:password@host:5432/finance_report"
  REDIS_URL: "redis://user:password@host:6379/0"
  RABBITMQ_URL: "amqp://user:password@rabbitmq:5672/"
  GEMINI_API_KEY: "your-gemini-api-key"
  GROQ_API_KEY: "your-groq-api-key"
  R2_ACCESS_KEY: "your-r2-access-key"
  R2_SECRET_KEY: "your-r2-secret-key"
  GOOGLE_CLIENT_ID: "your-google-client-id"
  GOOGLE_CLIENT_SECRET: "your-google-client-secret"
  JWT_SECRET: "change-me-to-a-random-256-bit-secret"
  VAPID_PRIVATE_KEY: "your-vapid-private-key"
  RESEND_API_KEY: "your-resend-api-key"
