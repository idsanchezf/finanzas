# ============================================================
# Finance Report — CD Pipeline (Continuous Deployment)
# ============================================================
# Orquestador: build imagenes Docker → invoca deploy-backend + deploy-frontend
#
# Disparadores:
#   - push a develop  → despliegue a staging
#   - push a main     → despliegue a produccion
#
# Flujo:
#   1. build-backend   → build + push imagen backend a GHCR
#   2. build-frontend  → build + push imagen frontend a GHCR
#   3. deploy-backend  → invoca deploy-backend.yml (Oracle OKE)
#   4. deploy-frontend → invoca deploy-frontend.yml (Vercel)
#
# Imagenes en GitHub Container Registry (ghcr.io):
#   ghcr.io/{owner}/finance-report/backend:{sha}     → siempre
#   ghcr.io/{owner}/finance-report/backend:develop   → staging
#   ghcr.io/{owner}/finance-report/backend:main      → produccion
#   ghcr.io/{owner}/finance-report/backend:latest    → solo main
# ============================================================

name: CD — Deploy

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "k8s/**"
      - ".github/workflows/cd.yml"
      - ".github/workflows/deploy-backend.yml"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Entorno de despliegue"
        required: true
        type: choice
        options:
          - staging
          - production

env:
  DOCKER_REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/backend
  FRONTEND_IMAGE: ${{ github.repository }}/frontend

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # 1. Build & Push — Backend Docker Image → GHCR
  # ============================================================
  build-backend:
    name: "Build & Push — Backend"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: src/backend
          file: src/backend/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # 2. Build & Push — Frontend Docker Image → GHCR
  # ============================================================
  build-frontend:
    name: "Build & Push — Frontend"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: src/frontend
          file: src/frontend/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # 3. Deploy Backend → Oracle OKE
  #    Invoca el workflow especializado deploy-backend.yml
  # ============================================================
  deploy-backend:
    name: "Deploy — Backend"
    needs: build-backend
    uses: ./.github/workflows/deploy-backend.yml
    with:
      environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      image-tag: ${{ needs.build-backend.outputs.image-tag }}
    secrets: inherit

  # ============================================================
  # 4. Deploy Frontend → Vercel
  #    Invoca el workflow especializado deploy-frontend.yml
  # ============================================================
  deploy-frontend:
    name: "Deploy — Frontend"
    needs: build-frontend
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    secrets: inherit
