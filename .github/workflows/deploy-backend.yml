# ============================================================
# Finance Report — Deploy Backend a Oracle Cloud OKE
# ============================================================
# Workflow especializado para despliegue del backend.
#
# Invocado por:
#   - cd.yml (workflow_call) — despliegue automatico staging/production
#   - Manual (workflow_dispatch) — despliegue manual
#
# Requiere:
#   - GitHub Environment configurado: staging, production
#   - Oracle OKE cluster configurado
#   - Secret: KUBE_CONFIG (kubeconfig en base64)
# ============================================================

name: Deploy Backend

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Entorno de despliegue (staging | production)"
      image-tag:
        required: true
        type: string
        description: "Tag de la imagen Docker a desplegar"
  workflow_dispatch:
    inputs:
      environment:
        description: "Entorno de despliegue"
        required: true
        type: choice
        options:
          - staging
          - production
      image-tag:
        description: "Tag de la imagen Docker (sha corto del commit)"
        required: true
        type: string

jobs:
  deploy:
    name: "Deploy Backend — ${{ inputs.environment }}"
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'production' && 'https://api.financereport.app' || 'https://staging.api.financereport.app' }}
    # Descomentar cuando OKE este configurado:
    # if: true
    if: false

    steps:
      - uses: actions/checkout@v4

      - name: "Desplegando backend [${{ inputs.environment }}]"
        run: |
          echo "=============================================="
          echo "  Entorno:      ${{ inputs.environment }}"
          echo "  Imagen:       ghcr.io/${{ github.repository }}/backend:${{ inputs.image-tag }}"
          echo "=============================================="

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig.yaml
          echo "KUBECONFIG=kubeconfig.yaml" >> $GITHUB_ENV

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/network-policy.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f k8s/rabbitmq-deployment.yaml
          kubectl apply -f k8s/deployment-backend.yaml
          kubectl apply -f k8s/deployment-workers.yaml
          kubectl apply -f k8s/service-backend.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/pdb.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Wait for rollout
        run: |
          kubectl set image deployment/finance-backend \
            backend="ghcr.io/${{ github.repository }}/backend:${{ inputs.image-tag }}" \
            -n finance-report
          kubectl rollout status deployment/finance-backend \
            -n finance-report --timeout=5m

      - name: Health check
        run: |
          sleep 10
          curl -f -s -o /dev/null -w "%{http_code}" \
            "${{ inputs.environment == 'production' && 'https://api.financereport.app/health' || 'https://staging.api.financereport.app/health' }}" \
            || echo "Health check fallo (puede ser normal si el dominio aun no resuelve)"

  # ============================================================
  # Documentacion: configuracion de Oracle OKE
  # ============================================================
  docs:
    name: "Docs — Oracle OKE setup"
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Setup instructions
        run: |
          echo "::notice::==================================================================="
          echo "::notice::Backend deploy deshabilitado (if: false)."
          echo "::notice::Para habilitar el despliegue a Oracle Cloud Kubernetes:"
          echo "::notice::"
          echo "::notice::  1. Cuenta Oracle Cloud Always Free: https://signup.cloud.oracle.com/"
          echo "::notice::  2. Crear VM Ampere A1 (4 OCPU, 24GB RAM, 200GB disco)"
          echo "::notice::  3. Crear cluster OKE:"
          echo "::notice::     oci ce cluster create --name finance-report-cluster ..."
          echo "::notice::  4. Obtener kubeconfig:"
          echo "::notice::     oci ce cluster create-kubeconfig --cluster-id <id> --file kubeconfig.yaml"
          echo "::notice::  5. Configurar KUBE_CONFIG en GitHub Secrets del Environment"
          echo "::notice::     cat kubeconfig.yaml | base64 -w0"
          echo "::notice::  6. Cambiar 'if: false' a 'if: true' en este workflow"
          echo "::notice::==================================================================="
