# ============================================================
# Finance Report — CI Pipeline (Continuous Integration)
# ============================================================
# Pipeline: lint → test → security scan
#
# Disparadores:
#   - push a feature/*, develop, main
#   - pull_request hacia develop, main
#
# NO construye imagenes Docker ni despliega.
# Eso es responsabilidad del CD (cd.yml).
# ============================================================

name: CI

on:
  push:
    branches:
      - "feature/**"
      - develop
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Stage 1: Lint (ruff)
  # ============================================================
  lint:
    name: "Lint (ruff)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('src/backend/requirements.txt', 'src/backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt

      - name: Ruff check
        run: ruff check src/

      - name: Ruff format check
        run: ruff format --check src/

  # ============================================================
  # Stage 2: Unit + Integration Tests (pytest)
  # ============================================================
  unit-tests:
    name: "Tests (pytest)"
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: src/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_report_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance_report_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('src/backend/requirements.txt', 'src/backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt

      - name: Run all tests
        run: |
          PYTHONPATH=. pytest tests/ \
            --cov=src \
            --cov-report=xml:coverage/coverage.xml \
            --cov-report=term-missing \
            --junitxml=junit.xml \
            -v
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/finance_report_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test

      - name: Upload coverage
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          files: src/backend/coverage/coverage.xml
          flags: unit
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            src/backend/junit.xml
            src/backend/coverage/

  # ============================================================
  # Stage 3: Security Scan (SAST + Dependency)
  # ============================================================
  security-scan:
    name: "Security Scan"
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('src/backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install tools + dependencies
        run: |
          pip install --no-cache-dir bandit pip-audit
          pip install --no-cache-dir -r requirements.txt

      - name: SAST - Bandit
        run: bandit -r src/ -f json -o bandit-report.json || true

      - name: Dependency scan - pip-audit
        run: pip-audit -r requirements.txt || true
        continue-on-error: true

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: src/backend/bandit-report.json
