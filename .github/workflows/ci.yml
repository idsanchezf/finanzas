# ============================================================
# Finance Report — CI/CD Pipeline
# ============================================================
# Pipeline multi-stage: lint -> test -> scan -> build -> push -> deploy
#
# Usa pip install -r requirements.txt (sin Poetry) para builds rapidos.
#
# Disparadores:
#   - push a feature/*, develop, main
#   - pull_request hacia develop, main
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches:
      - "feature/**"
      - develop
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/finance-report-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/finance-report-frontend

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Stage 1: Linting
  # ============================================================
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('src/backend/requirements.txt', 'src/backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (pip)
        run: |
          pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt

      - name: Ruff check
        run: ruff check src/

      - name: Ruff format check (black-compatible)
        run: ruff format --check src/

  # ============================================================
  # Stage 2: Unit Tests
  # ============================================================
  unit-tests:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: src/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_report_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance_report_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('src/backend/requirements.txt', 'src/backend/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (pip)
        run: |
          pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt

      - name: Run all tests
        run: |
          PYTHONPATH=. pytest tests/ \
            --cov=src \
            --cov-report=xml:coverage/coverage.xml \
            --cov-report=term-missing \
            --junitxml=junit.xml \
            -v
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/finance_report_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test

      - name: Upload coverage to Codecov (optional)
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          files: src/backend/coverage/coverage.xml
          flags: unit
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            src/backend/junit.xml
            src/backend/coverage/

  # ============================================================
  # Stage 3: Security Scan (SAST + Dependency)
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('src/backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install tools + dependencies
        run: |
          pip install --no-cache-dir bandit pip-audit
          pip install --no-cache-dir -r requirements.txt

      - name: SAST - Bandit
        run: bandit -r src/ -f json -o bandit-report.json || true

      - name: Dependency scan - pip-audit
        run: pip-audit -r requirements.txt || true
        continue-on-error: true

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: src/backend/bandit-report.json

  # ============================================================
  # Stage 4: Build & Push Docker Images
  # ============================================================
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [unit-tests, security-scan]
    if: |
      github.ref == 'refs/heads/develop' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/feature/')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: src/backend
          file: src/backend/Dockerfile
          target: production
          push: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: src/frontend
          file: src/frontend/Dockerfile
          target: production
          push: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Stage 5: Deploy (Staging — develop branch)
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.financereport.app
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via Docker Compose (staging server)
        run: |
          echo "Deploying to staging environment..."
          echo "BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
          echo "FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"
        continue-on-error: true

      - name: Smoke tests
        run: |
          sleep 10
          bash scripts/smoke-test.sh
        env:
          BASE_URL: https://staging.financereport.app
        continue-on-error: true

  # ============================================================
  # Stage 6: Deploy (Production — main branch)
  # ============================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.financereport.app
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Production
        run: |
          echo "Deploying to production environment..."
          echo "BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
          echo "FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"
        continue-on-error: true

      - name: Smoke tests (production)
        run: |
          sleep 15
          bash scripts/smoke-test.sh
        env:
          BASE_URL: https://api.financereport.app
        continue-on-error: true

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ Production deployment failed! Check [workflow run](' +
                'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})'
            })
