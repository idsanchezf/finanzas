# ============================================================
# Finance Report — CI Pipeline
# Ejecuta lint, test y build de imagenes Docker en cada push y PR.
# ============================================================
# Dispara en:
#   - push a develop, feature/*
#   - pull request a develop, main
#
# Jobs:
#   1. backend-lint      — ruff + black + mypy
#   2. backend-test      — unit tests + integration tests (SQLite)
#   3. frontend-test     — eslint + type-check + vitest
#   4. build-docker      — build imagenes Docker (solo PR a develop/main)
# ============================================================

name: CI — Lint & Test & Build

on:
  push:
    branches: [develop, 'feature/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # 1. Backend — Lint & Format
  # ============================================================
  backend-lint:
    name: "Backend — Lint & Format"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-root

      - name: Lint with ruff
        run: poetry run ruff check src/ tests/

      - name: Format check with black
        run: poetry run black --check src/ tests/

      - name: Type check with mypy
        run: poetry run mypy src/ --ignore-missing-imports

  # ============================================================
  # 2. Backend — Unit & Integration Tests
  # ============================================================
  backend-test:
    name: "Backend — Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run unit tests
        run: >
          poetry run pytest tests/unit/
          --cov=src
          --cov-report=xml:coverage/unit-coverage.xml
          --cov-report=term-missing
          -v

      - name: Run integration tests (SQLite in-memory)
        run: >
          poetry run pytest tests/integration/
          --cov=src
          --cov-append
          --cov-report=xml:coverage/integration-coverage.xml
          --cov-report=term-missing
          -v

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: src/backend/coverage/

  # ============================================================
  # 3. Frontend — Lint, Type Check & Test
  # ============================================================
  frontend-test:
    name: "Frontend — Lint & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Cache se activa automaticamente cuando package-lock.json este commiteado.
          # Mientras tanto, npm install funciona sin cache.
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        # TODO: Cambiar a 'npm ci' cuando package-lock.json este commiteado
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: src/frontend/coverage/

  # ============================================================
  # 4. Build Docker Images — Solo en PR a develop/main
  # ============================================================
  build-docker:
    name: "Docker — Build Images"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'develop')
    needs: [backend-test, frontend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (production)
        uses: docker/build-push-action@v5
        with:
          context: src/backend
          file: src/backend/Dockerfile
          target: production
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (production)
        uses: docker/build-push-action@v5
        with:
          context: src/frontend
          file: src/frontend/Dockerfile
          target: production
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
